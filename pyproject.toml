[project]
name = "triage"
version = "0.1.0"
description = "Support ticket triage service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    # Runtime, not training-only: the API calls the deployed endpoint when
    # INFERENCE_BACKEND=sagemaker.
    "boto3>=1.34",
    "sqlalchemy>=2.0",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "mlflow==2.17.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Kept out of the runtime dependencies on purpose: torch and the transformer
# weights would add gigabytes to a serving image that only needs to answer HTTP
# requests. If an embedding model ever wins on merit and gets deployed, paying
# that cost becomes a deliberate choice rather than an accident.
training = [
    "sentence-transformers>=3.0",
    # Capped below 3.0: that release replaces the estimator API entirely
    # (sagemaker.pytorch no longer exists) with a restructured one that little
    # documentation covers yet. Not worth adapting to for a job that runs for
    # twenty minutes.
    "sagemaker>=2.200,<3",
]

dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
